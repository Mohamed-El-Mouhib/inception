services:
  nginx:
    build: ./requirements/nginx
    image: local_nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - wp_volume:/var/www/html
    networks:
      - docker-network

  wordpress:
    build: ./requirements/wordpress
    image: local_wordpress
    container_name: wordpress
    # restart: always
    volumes:
      - wp_volume:/var/www/html
    networks:
      - docker-network
    depends_on:
      - mariadb

  mariadb:
    build: ./requirements/mariadb
    image: local_mariadb
    container_name: mariadb
    networks:
      - docker-network
    env_file:
      - ../secrets/mariadb_secrets.env
    volumes:
      - DB:/home/mel-mouh/data

volumes:
  wp_volume:
  DB:

networks:
  docker-network:
    driver: bridge
