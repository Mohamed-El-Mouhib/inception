services:
  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - wp_volume:/var/www/html
    networks:
      - docker-network
    depends_on:
      - wordpress

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    volumes:
      - wp_volume:/var/www/html
    networks:
      - docker-network
    depends_on:
      - mariadb

  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    networks:
      - docker-network
    env_file:
      - ../secrets/mariadb_secrets.env
    volumes:
      - DB:/var/lib/mysql

volumes:
  wp_volume:
  DB:

networks:
  docker-network:
    driver: bridge
